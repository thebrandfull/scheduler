            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;

        }
        button:hover:not(:disabled) {

        }
        button:disabled {

        #output {

            border-radius: 10px;

            font-family: 'Courier New', monospace;

            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
            display: none;
        }
        #output.show { display: block; }
        .log-line {
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .log-info { background: #e3f2fd; color: #1976d2; }
        .log-success { background: #e8f5e9; color: #2e7d32; }
        .log-error { background: #ffebee; color: #c62828; }
        .log-warning { background: #fff3e0; color: #ef6c00; }
        .progress {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
            display: none;
        }
        .progress.show { display: block; }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);

</html>
